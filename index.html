html,body{margin:0;padding:0}

.frame.thin{padding:3px}
.in{background:var(--f)}
.in.white{background:#fff}
.sh{filter:drop-shadow(5px 5px 0 var(--b))}
.shd{filter:drop-shadow(5px 5px 0 var(--dk))}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco svg{position:absolute;shape-rendering:crispEdges}
@keyframes twinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.star{animation:twinkle 1.6s steps(3) infinite}
.t1{animation-delay:.2s}.t2{animation-delay:.5s}.t3{animation-delay:.8s}.t4{animation-delay:1.1s}
.cloud{opacity:.5}

#app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.center{display:flex;justify-content:center}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.muted{color:var(--s)}
/* header dropdown */
.hdr{position:relative;display:flex;justify-content:center;z-index:5}
.dd{width:260px}
.ddbtn{width:100%;height:52px;border:0;background:var(--f);color:var(--i);font-size:14px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 12px}
.menu{position:absolute;top:62px;width:270px;filter:drop-shadow(5px 5px 0 var(--b))}
.menu .in{display:flex;flex-direction:column;padding:6px}
.mi{display:flex;align-items:center;gap:12px;height:48px;border:0;background:transparent;font-size:12px;color:var(--i);padding:0 10px;text-align:left}
.mi.cur{background:var(--l)}
.mi i{display:block;width:16px;height:16px;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.35)}
/* segmented */
.seg{display:flex}
.sg{height:44px;min-width:44px;border:3px solid var(--s);background:var(--f);color:var(--i);font-size:11px;padding:0 10px}
.sg+.sg{border-left:0}
.sg.on{background:var(--s);color:#fff}
.sg.big{font-size:16px;padding:0}
/* inputs */
.fld{background:var(--b);padding:3px;flex:0 1 54px;min-width:42px}
.fld input{display:block;width:100%;height:38px;border:0;background:var(--f);text-align:center;font-size:28px;color:var(--i);padding:0;outline:none}
.fld input:focus{background:#fff}
.fld.wide{flex:0 1 92px}
.u{font-size:22px}
.lbl{font-size:10px;color:var(--s)}
.xbtn{width:36px;height:44px;border:0;background:transparent;color:var(--s);font-size:12px;padding:0;flex:none}
.rows{display:flex;flex-direction:column;gap:10px}
.rowin{padding:8px 8px;display:flex;align-items:center;gap:6px}
.addrow{width:100%;height:50px;border:0;background:var(--l);color:var(--s);font-size:12px}
.bigbtn{width:100%;height:66px;border:0;background:var(--btn);color:var(--bt);font-size:16px}
.bigbtn:disabled{opacity:.6}
.screen{padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.big{font-size:32px;line-height:1.2;white-space:nowrap}
.sub{font-size:20px;color:var(--s)}
.neg{color:var(--neg)}
.tag{display:inline-block;background:var(--l);color:var(--i);font-size:9px;padding:6px 8px}
.sticky{position:sticky;top:8px;z-index:3}
.chip{background:var(--l);padding:8px;font-size:11px;color:var(--i)}

.tapb{width:122px;height:56px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;background:var(--l);color:var(--i)}
.tapb.done{background:var(--s);color:#fff}
.tapb .hint{font-family:'VT323',monospace;font-size:17px;color:var(--s)}
.tapb.done .hint{color:var(--bg)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:9px;text-align:center;color:var(--s);padding-bottom:4px}

.day.sel{background:var(--s);color:#fff}
.day.today{box-shadow:inset 0 0 0 3px var(--b)}

.cb.on{background:var(--l)}
.done-t{text-decoration:line-through;color:var(--s)}

.duebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.tag.over{background:var(--s);color:#fff}
/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(40,20,40,.35);z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}
#modal[hidden]{display:none}
#modal .box{width:100%;max-width:400px;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;pointer-events:none;transition:opacity .2s}
#toast[hidden]{display:none}
.txt{width:100%;height:46px;border:0;background:var(--f);padding:0 12px;font-size:24px;color:var(--i);outline:none}
.list-sep{border-top:3px dashed var(--b)}
.tile{display:block;text-decoration:none;color:inherit;border:0;padding:0;background:transparent;width:100%;text-align:center}
.small{font-size:18px}
.hidden{display:none!important}
</style>

function merge(d,o){
  if(!o||typeof o!=='object'||Array.isArray(o))return d;

function localYMD(date){return ymd(date.getFullYear(),date.getMonth()+1,date.getDate());}
function parseYMD(s){const [y,m,d]=s.split('-').map(Number);return {y,m,d};}
function wdOf(s){const {y,m,d}=parseYMD(s);return ['SUN','MON','TUE','WED','THU','FRI','SAT'][new Date(y,m-1,d).getDay()];}
function hmToMin(s){if(!s)return null;const m=/^(\d{1,2}):?(\d{2})$/.exec(String(s).trim());if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return h*60+mi;}
function minToHM(min){return pad2(Math.floor(min/60))+':'+pad2(min%60);}
const digits=v=>v.replace(/[^\d]/g,'');
const decimal=v=>{v=v.replace(/,/g,'.').replace(/[^\d.]/g,'');const i=v.indexOf('.');return i<0?v:v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------------- pixel art ---------------- */
function rect(x,y,c,w=1,h=1){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c+'"/>';}
function sparkle(c){return rect(3,0,c,1,7)+rect(0,3,c,7,1)+rect(2,2,c,3,3);}
const CLOUD=[[0,4,7],[1,2,12],[2,1,13],[3,0,15],[4,0,15],[5,1,14]].map(([y,a,b])=>rect(a,y,'#FFFFFF',b-a+1,1)).join('');
function gridSvg(rows,color,px){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));let r='';
  rows.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#')r+=rect(x,y,color);}));
  return '<svg style="width:'+w*px+'px;height:'+h*px+'px;shape-rendering:crispEdges" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'+r+'</svg>';
}
function line(x0,y0,x1,y1){
  const pts=[];const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(let n=0;n<64;n++){pts.push([x0,y0]);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx;}if(e2<=dx){e+=dx;y0+=sy;}}
  return pts;
}
function clockSvg(h,m,size,c){
  c=c||{ring:'#2A5D8A',face:'#FFFFFF',tick:'#8CC3EE',min:'#17405F',hr:'#2A5D8A',dot:'#F48FB8'};
  let r='';
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const d=Math.hypot(x-10,y-10);if(d<8.5)r+=rect(x,y,c.face);else if(d<9.6)r+=rect(x,y,c.ring);}
  r+=rect(10,2,c.tick)+rect(18,10,c.tick)+rect(10,18,c.tick)+rect(2,10,c.tick);
  if(h!=null){
    const am=m*6*Math.PI/180,ah=((h%12)+m/60)*30*Math.PI/180;
    line(10,10,Math.round(10+7.2*Math.sin(am)),Math.round(10-7.2*Math.cos(am))).forEach(([x,y])=>r+=rect(x,y,c.min));
    line(10,10,Math.round(10+4.6*Math.sin(ah)),Math.round(10-4.6*Math.cos(ah))).forEach(([x,y])=>r+=rect(x,y,c.hr));
  }
  r+=rect(10,10,c.dot)+rect(3,0,c.ring,3,2)+rect(15,0,c.ring,3,2);
  return '<svg role="img" aria-label="Pixel clock" style="width:'+size+'px;height:'+size+'px;shape-rendering:crispEdges;display:block" viewBox="0 0 21 21">'+r+'</svg>';
}
const TICK=c=>'<svg style="width:16px;height:14px;shape-rendering:crispEdges" viewBox="0 0 7 6" aria-hidden="true">'+[[6,0],[5,1],[4,2],[3,3],[2,4],[1,3],[0,2]].map(([x,y])=>rect(x,y,c,1,2)).join('')+'</svg>';
const CARET=c=>'<svg style="width:15px;height:9px;shape-rendering:crispEdges" viewBox="0 0 5 3" aria-hidden="true">'+rect(0,0,c,5)+rect(1,1,c,3)+rect(2,2,c)+'</svg>';

function renderDeco(t){
  let h='';
  [[3,84,128],[60,88,144],[30,92,96]].forEach(([l,top,w])=>{h+='<svg class="cloud" style="left:'+l+'%;top:'+top+'%;width:'+w+'px;height:'+(w*6/16)+'px" viewBox="0 0 16 6" aria-hidden="true">'+CLOUD+'</svg>';});
  STAR_POS.forEach(([l,top,size,cls],n)=>{h+='<svg class="star '+cls+'" style="left:'+l+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px" viewBox="0 0 7 7" aria-hidden="true">'+sparkle(t.stars[n%t.stars.length])+'</svg>';});
  $('#deco').innerHTML=h;

function applyTheme(name){
  const t=THEMES[name],r=document.documentElement.style;
  for(const k of ['bg','s','i','f','b','l','dk','btn','neg'])r.setProperty('--'+k,t[k]);
  r.setProperty('--bt',t.bt);
  const meta=document.querySelector('meta[name=theme-color]');if(meta)meta.setAttribute('content',t.bg);
  renderDeco(t);
}

function rowsHtml(rows){

    '<div class="seg"><button type="button" class="sg big ps'+(r.s>0?' on':'')+'" aria-label="Add" aria-pressed="'+(r.s>0)+'" data-act="sign" data-i="'+i+'" data-v="1">+</button><button type="button" class="sg big ps'+(r.s<0?' on':'')+'" aria-label="Subtract" aria-pressed="'+(r.s<0)+'" data-act="sign" data-i="'+i+'" data-v="-1">'+MINUS+'</button></div>'+

}
const rowsTotal=rows=>rows.reduce((a,r)=>a+r.s*(num(r.h)*60+num(r.m)),0);
function rowsExpr(rows,startLabel){
  const used=rows.filter(r=>r.h!==''||r.m!=='');
  if(!used.length)return startLabel||'add some time';
  if(used.length>5)return (startLabel?startLabel+' ':'')+used.length+' rows';
  let s=startLabel||'';
  used.forEach((r,n)=>{const v=(num(r.h)+Math.floor(num(r.m)/60))+':'+pad2(num(r.m)%60);
    if(!s&&n===0)s=(r.s<0?MINUS:'')+v;else s+=' '+(r.s<0?MINUS:'+')+' '+v;});
  return s;
}

/* FLIGHT TIMER */
const EV=[['out','OUT','engine start'],['off','OFF','wheels up'],['on','ON','wheels down'],['in','IN','parked']];
function evParts(ms,zulu){const d=new Date(ms);return zulu?{y:d.getUTCFullYear(),mo:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours(),m:d.getUTCMinutes()}:{y:d.getFullYear(),mo:d.getMonth(),d:d.getDate(),h:d.getHours(),m:d.getMinutes()};}
function evMs(y,mo,d,h,m,zulu){return zulu?Date.UTC(y,mo,d,h,m):new Date(y,mo,d,h,m).getTime();}
function durMin(a,b){if(a==null||b==null)return null;let d=Math.round((b-a)/60000);while(d<0)d+=1440;return d;}
P.timer={
  html(){
    const t=S.timer,z=t.zulu;
    const rows=EV.map(([k,lab,hint])=>{const ms=t.ev[k],done=ms!=null,p=done?evParts(ms,z):null;
      const sub=done&&!S.fmt24?fmtHM(p.h,p.m):hint;
      return '<div class="frame thin px"><div class="in white px rowin" style="padding:8px 10px;gap:8px">'+
        '<div style="filter:drop-shadow(3px 3px 0 var(--b));flex:none"><div class="pxs" style="background:var(--i);padding:3px"><button type="button" class="pxs tapb'+(done?' done':'')+'" aria-pressed="'+done+'" data-act="tap" data-k="'+k+'"><span class="ps row g8" style="font-size:15px">'+lab+(done?TICK('#FFFFFF'):'')+'</span><span class="hint">'+sub+'</span></button></div></div>'+
        '<div class="row" style="margin-left:auto;gap:4px"><div class="fld pxs" style="flex-basis:50px"><input class="pxs" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="--" aria-label="'+lab+' hour" data-in="th" data-k="'+k+'" value="'+(done?pad2(p.h):'')+'"></div><span class="ps" style="font-size:13px">:</span>'+
        '<div class="fld pxs" style="flex-basis:50px"><input class="pxs" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="--" aria-label="'+lab+' minute" data-in="tm" data-k="'+k+'" value="'+(done?pad2(p.m):'')+'"></div>'+
        '<span class="ps" style="font-size:11px;width:14px">'+(z?'Z':'L')+'</span></div></div></div>';}).join('');
    const box=(id,label)=>'<div class="frame px"><div class="in px screen" style="padding:12px 6px"><span class="ps" style="font-size:9px;color:var(--s)">'+label+'</span><span class="ps" style="font-size:19px" id="'+id+'"></span><span class="small muted" id="'+id+'s"></span></div></div>';
    const saved=t.savedId&&S.diary.flights.some(f=>f.id===t.savedId);
    return '<div class="center g14" style="flex-wrap:wrap">'+fmtSeg()+zoneSeg(z)+'</div><div class="col g10">'+rows+'</div>'+
      '<div class="grid2">'+box('tblock','BLOCK TIME')+box('tflight','FLIGHT TIME')+'</div>'+
      '<div class="row g14" style="margin-top:4px">'+
        '<div style="flex:1;filter:drop-shadow(5px 5px 0 #262E6B)"><div class="px" style="background:#262E6B;padding:4px"><button type="button" class="px bigbtn ps" id="tsave" data-act="tsave" style="background:#C7CCFF;color:#161C4A;font-size:11px;line-height:1.6">'+(saved?'SAVED<br>TO DIARY':'SAVE TO<br>DIARY')+'</button></div></div>'+
        '<div style="flex:1">'+bigBtn('RESET','treset').replace('font-size:16px','')+'</div></div>';
  },
  update(){
    const e=S.timer.ev;
    const b=durMin(e.out,e.in),f=durMin(e.off,e.on);
    $('#tblock').textContent=b==null?'-h --m':fmtDur(b);$('#tblocks').textContent=b==null?'tap OUT + IN':'OUT → IN';
    $('#tflight').textContent=f==null?'-h --m':fmtDur(f);$('#tflights').textContent=f==null?'tap OFF + ON':'OFF → ON';
  }
};

/* SDT */
function sdtCalc(){
  const s=S.sdt,gs=num(s.gs),dist=num(s.dist),tmin=num(s.th)*60+num(s.tm);
  if(s.solve==='time'){if(s.gs===''||s.dist===''||gs<=0)return null;const m=dist/gs*60;return {label:'TIME EN ROUTE',val:fmtDur(m),sub:trimNum(dist)+' NM at '+trimNum(gs)+' KT',sub2:m.toFixed(1)+' min',raw:m};}
  if(s.solve==='dist'){if(s.gs===''||(s.th===''&&s.tm==='')||gs<0)return null;const d=gs*tmin/60;return {label:'DISTANCE',val:trimNum(d)+' NM',sub:trimNum(gs)+' KT for '+fmtDur(tmin),sub2:'',raw:d};}
  if(s.dist===''||(s.th===''&&s.tm==='')||tmin<=0)return null;const g=dist/(tmin/60);return {label:'GROUNDSPEED',val:trimNum(g)+' KT',sub:trimNum(dist)+' NM in '+fmtDur(tmin),sub2:'',raw:g};
}

function makeFlight(date,out,off,on,inn,id){

function zoneSuggest(q){

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(menuOpen&&(!b||(b.dataset.act!=='menu'&&b.dataset.act!=='go'))){menuOpen=false;rerender();if(!b)return;}
  if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,pg=curPage().id;
  const rowsOf=()=>pg==='calc'?S.calc.rows:S.clock.rows;
  switch(a){
    case 'menu':menuOpen=!menuOpen;rerender();return;
    case 'go':menuOpen=false;if(location.hash==='#'+b.dataset.p)render();else location.hash=b.dataset.p;return;
    case 'fmt':S.fmt24=b.dataset.v==='24';break;
    case 'zmode':if(pg==='clock')S.clock.zulu=b.dataset.v==='Z';else S.timer.zulu=b.dataset.v==='Z';break;
    case 'sign':rowsOf()[i].s=+b.dataset.v;break;
    case 'addrow':rowsOf().push(newRow());save();rerender();{const ins=document.querySelectorAll('[data-in="rh"]');if(ins.length)ins[ins.length-1].focus();}return;
    case 'delrow':{const r=rowsOf();if(r.length>1)r.splice(i,1);else r[0]=newRow();break;}
    case 'clearcalc':S.calc.rows=[newRow()];break;
    case 'clearclock':S.clock.rows=[newRow()];S.clock.sh='';S.clock.sm='';break;
    case 'now':{const n=new Date(),p=S.clock.zulu?partsIn(n,'UTC'):{h:n.getHours(),m:n.getMinutes()};S.clock.sh=pad2(p.h);S.clock.sm=pad2(p.m);break;}
    case 'tap':{const k=b.dataset.k,t=S.timer,stamp=()=>{t.ev[k]=Math.floor(Date.now()/60000)*60000;};if(t.ev[k]!=null){askConfirm('RE-STAMP '+k.toUpperCase()+' WITH THE TIME NOW?','RE-STAMP',stamp);return;}stamp();break;}
    case 'tsave':{const e=S.timer.ev;if(!((e.out!=null&&e.in!=null)||(e.off!=null&&e.on!=null))){toast('needs OUT + IN or OFF + ON');return;}
      const L=ms=>{if(ms==null)return null;const d=new Date(ms);return pad2(d.getHours())+':'+pad2(d.getMinutes());};
      const first=e.out!=null?e.out:e.off;
      const f={id:S.timer.savedId||uid(),date:localYMD(new Date(first)),out:L(e.out),off:L(e.off),on:L(e.on),in:L(e.in),block:durMin(e.out,e.in),flight:durMin(e.off,e.on)};
      const idx=S.diary.flights.findIndex(x=>x.id===f.id);if(idx>=0)S.diary.flights[idx]=f;else S.diary.flights.push(f);
      S.timer.savedId=f.id;S.diary.sel=f.date;S.diary.month=f.date.slice(0,7);save();rerender();toast(idx>=0?'diary entry updated':'saved to diary!');return;}
    case 'treset':{const e=S.timer.ev,go=()=>{S.timer.ev={out:null,off:null,on:null,in:null};S.timer.savedId=null;};if(e.out||e.off||e.on||e.in){askConfirm('RESET THE FLIGHT TIMER?','RESET',go);return;}go();break;}
    case 'solve':S.sdt.solve=b.dataset.v;break;
    case 'clearsdt':S.sdt.gs='';S.sdt.dist='';S.sdt.th='';S.sdt.tm='';break;
    case 'month':{let [y,m]=curMonth().split('-').map(Number);m+=+b.dataset.v;if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.diary.month=y+'-'+pad2(m);break;}
    case 'thismonth':{const n=new Date();S.diary.month=n.getFullYear()+'-'+pad2(n.getMonth()+1);S.diary.sel=localYMD(n);break;}
    case 'day':S.diary.sel=b.dataset.d;break;
    case 'delflight':{const id=b.dataset.id;askConfirm('DELETE THIS FLIGHT FROM YOUR DIARY?','DELETE',()=>{S.diary.flights=S.diary.flights.filter(f=>f.id!==id);});return;}
    case 'logflight':flightForm(S.diary.sel||localYMD(new Date()));return;
    case 'saveflight':{const g=id=>$('#'+id).value.trim(),date=g('ff_date'),v=['ff_out','ff_off','ff_on','ff_in'].map(g);
      const err=$('#ff_err');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent='pick a date';return;}
      for(const x of v)if(x&&hmToMin(x)==null){err.textContent='times look like 09:15 (24h)';return;}
      if(!((v[1]&&v[2])||(v[0]&&v[3]))){err.textContent='fill OFF + ON, or OUT + IN';return;}
      S.diary.flights.push(makeFlight(date,...v));S.diary.sel=date;S.diary.month=date.slice(0,7);save();closeModal();rerender();toast('flight logged!');return;}
    case 'closemodal':closeModal();return;
    case 'confirmyes':{const cb=askConfirm.cb;askConfirm.cb=null;closeModal();if(cb){cb();save();rerender();}return;}
    case 'addtask':{const el=$('#newtask'),t=el.value.trim();if(!t){el.focus();return;}S.todo.items.push({id:uid(),text:t,done:false,due:null});save();rerender();$('#newtask').focus();return;}
    case 'tick':S.todo.items[i].done=!S.todo.items[i].done;break;
    case 'deltask':S.todo.items.splice(i,1);break;
    case 'cleardone':if(!S.todo.items.some(x=>x.done))return;S.todo.items=S.todo.items.filter(x=>!x.done);break;
    case 'addzone':zoneModal();return;
    case 'pickzone':$('#zcode').value=b.dataset.c;addZone(b.dataset.c);return;
    case 'savezone':addZone($('#zcode').value);return;
    case 'delzone':S.zones.splice(i,1);break;
    case 'backup':doBackup();return;
    case 'restore':$('#restoreFile').click();return;
    default:return;
  }
  save();rerender();
});
function addZone(c){c=(c||'').trim().toUpperCase();
  if(!IATA[c]){$('#zerr').textContent=c?c+' is not in the list yet':'type a code';return;}
  if(S.zones.includes(c)){$('#zerr').textContent=c+' is already added';return;}
  S.zones.push(c);save();closeModal();rerender();}

});

function timerEdit(k){
  const t=S.timer,z=t.zulu;
  const hEl=document.querySelector('[data-in=th][data-k='+k+']'),mEl=document.querySelector('[data-in=tm][data-k='+k+']');
  const hv=hEl.value,mv=mEl.value;
  if(hv===''&&mv===''){t.ev[k]=null;t.savedId=null;save();P.timer.update();return;}
  if(hv.length<1||mv.length<2)return;
  const h=+hv,m=+mv;if(h>23||m>59)return;
  const order=EV.map(x=>x[0]),idx=order.indexOf(k);
  let prev=null;for(let j=idx-1;j>=0;j--)if(t.ev[order[j]]!=null){prev=t.ev[order[j]];break;}
  const base=t.ev[k]!=null?t.ev[k]:(prev!=null?prev:Date.now());
  const bp=evParts(base,z);let ms=evMs(bp.y,bp.mo,bp.d,h,m,z);
  if(prev!=null){while(ms<prev)ms+=864e5;while(ms-prev>864e5)ms-=864e5;}
  t.ev[k]=ms;save();P.timer.update();
  const btn=document.querySelector('[data-act=tap][data-k='+k+']');
  if(btn&&!btn.classList.contains('done')){rerender();}
}

/* ---------------- backup / restore ---------------- */
function doBackup(){
  const n=new Date(),name='timecalc-backup-'+localYMD(n)+'.json';
  S.lastBackup=localYMD(n);save();
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  rerender();toast('backup saved to downloads');
}
function doRestore(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=='object'||!o.diary)throw 0;
      askConfirm('RESTORE THIS BACKUP? IT REPLACES EVERYTHING IN THE APP NOW.','RESTORE',()=>{S=merge(defaults(),o);setTimeout(()=>toast('backup restored!'),50);});}catch(e){toast('that file is not a backup');}
    $('#restoreFile').value='';};
  r.readAsText(file);
}

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}}
window.__tc={S:()=>S,sdtCalc,rowsTotal,fmtDur,makeFlight,durMin};
})();
